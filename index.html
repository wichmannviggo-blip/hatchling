<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatchling</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hatchling</h1>

    <section id="auth" hidden>
      <p>Log in to keep your pet on every device and join the global leaderboard.</p>
      <input id="em" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
      <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" aria-label="Password">
      <p id="aerr" role="alert"></p>
      <div class="opts"><button id="login">Log in</button><button id="signup">Sign up</button></div>
      <button id="guest">Play without an account</button>
    </section>

    <section id="egg" hidden>
      <div id="eggart"></div>
      <button id="hatchbtn">Hatch the egg</button>
      <div id="namebox" hidden>
        <p id="got"></p>
        <input id="nm" maxlength="16" placeholder="Name your pet" aria-label="Pet name">
        <button id="go">Start</button>
      </div>
    </section>

    <section id="game" hidden>
      <div id="stage">
        <div id="pet"></div>
        <div id="fx"></div>
      </div>
      <h2 id="pname"></h2>
      <div id="stats">
        <div><span>Animal</span><b id="s-sp"></b></div>
        <div><span>Stage</span><b id="s-st"></b></div>
        <div><span>Age</span><b id="s-age"></b></div>
        <div><span>XP</span><b id="s-xp"></b></div>
        <div><span>Mood</span><b id="s-mood"></b></div>
      </div>
      <div class="bars">
        <label>Hunger<div class="bar"><i id="bh"></i></div></label>
        <label>Happiness<div class="bar"><i id="bp"></i></div></label>
        <label id="xl">Growth<div class="bar"><i id="bx"></i></div></label>
      </div>
      <div id="tasks"></div>
      <div id="act"></div>
      <p id="toast" role="status"></p>
      <div id="lbbox">
        <h3>Leaderboard</h3>
        <div id="lb"></div>
        <button id="logout" hidden>Log out</button>
      </div>
    </section>
  </main>
  <button id="adminbtn">Admin</button>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="sprites.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
